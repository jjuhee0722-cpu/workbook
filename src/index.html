<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="업무수첩"/>
  <title>📋 업무수첩</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; background: #f2f2ef; -webkit-font-smoothing: antialiased; }
    input, textarea, select, button { font-family: inherit; }
    input[type=date] { -webkit-appearance: none; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .app-title, .header-action, .sync-label { white-space: nowrap; }
    @media (max-width: 480px) {
      .app-header { padding: 0 8px !important; }
      .app-header-left, .app-header-actions { gap: 5px !important; }
      .app-title { font-size: 14px !important; }
      .header-count, .sync-label { display: none !important; }
      .header-action { padding: 7px 8px !important; font-size: 11px !important; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script type="text/babel" data-presets="react" src="./data/local.js"></script>
<script type="text/babel" data-presets="react" src="./data/sync.js"></script>
<script type="text/babel" data-presets="react" src="./ui/tasks.jsx"></script>
<script type="text/babel" data-presets="react" src="./ui/contacts.jsx"></script>
<script type="text/babel" data-presets="react" src="./ui/calendar.jsx"></script>
<script type="text/babel" data-presets="react" src="./ui/media.jsx"></script>
<script type="text/babel" data-presets="react" src="./ui/auth.jsx"></script>
<script type="text/babel" data-presets="react" src="./app.jsx"></script>
</body>
</html>
